<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F5F7FB" height="900" rx="0" ry="0" stroke="none" stroke-width="1" width="1600" x="0" y="0" /><rect fill="#10203B" height="160" rx="0" ry="0" stroke="none" stroke-width="1" width="1600" x="0" y="0" /><text fill="#79D1D4" font-family="'DejaVu Sans',Arial,sans-serif" font-size="21" font-weight="700" x="72" y="52">RECALLCASE  /  BUILD ROADMAP</text><text fill="#FFFFFF" font-family="'DejaVu Sans',Arial,sans-serif" font-size="40" font-weight="700" x="72" y="112">Six stages to an evidence-backed investigation</text><rect fill="#25456D" height="30" rx="15" ry="15" stroke="none" stroke-width="1" width="98.0" x="1330" y="50" /><text fill="#CAEDFC" font-family="'DejaVu Sans',Arial,sans-serif" font-size="15" font-weight="700" x="1343" y="71">SOLO MVP</text><rect fill="#E3EAF3" height="247" rx="19" ry="19" stroke="none" stroke-width="1" width="458" x="71" y="216" /><rect fill="#FFFFFF" height="247" rx="19" ry="19" stroke="#DDE5EF" stroke-width="1.2" width="458" x="68" y="208" /><rect fill="#295DD5" height="247" rx="5" ry="5" stroke="none" stroke-width="1" width="9" x="68" y="208" /><text fill="#295DD5" font-family="'DejaVu Sans',Arial,sans-serif" font-size="37" font-weight="700" x="99" y="260">01</text><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="700" x="176" y="259">DEFINE CASES</text><text fill="#60718A" font-family="'DejaVu Sans',Arial,sans-serif" font-size="17" font-weight="400" x="99" y="296">Pick 3 case studies + 1 control</text><circle cx="108" cy="327" fill="#295DD5" r="4" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="122" y="334">Verify record availability</text><circle cx="108" cy="356" fill="#295DD5" r="4" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="122" y="363">Specify questions and evidence IDs</text><line stroke="#DDE5EF" stroke-width="1.3" x1="99" x2="498" y1="402" y2="402" /><text fill="#295DD5" font-family="'DejaVu Sans',Arial,sans-serif" font-size="15" font-weight="700" x="99" y="431">OUTPUT  Case list + test questions</text><rect fill="#E3EAF3" height="247" rx="19" ry="19" stroke="none" stroke-width="1" width="458" x="573" y="216" /><rect fill="#FFFFFF" height="247" rx="19" ry="19" stroke="#DDE5EF" stroke-width="1.2" width="458" x="570" y="208" /><rect fill="#21A9B6" height="247" rx="5" ry="5" stroke="none" stroke-width="1" width="9" x="570" y="208" /><text fill="#21A9B6" font-family="'DejaVu Sans',Arial,sans-serif" font-size="37" font-weight="700" x="601" y="260">02</text><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="700" x="678" y="259">INGEST RECORDS</text><text fill="#60718A" font-family="'DejaVu Sans',Arial,sans-serif" font-size="17" font-weight="400" x="601" y="296">Fetch public NHTSA data</text><circle cx="610" cy="327" fill="#21A9B6" r="4" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="624" y="334">Complaints • recalls • investigations</text><circle cx="610" cy="356" fill="#21A9B6" r="4" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="624" y="363">Cache raw files and provenance</text><line stroke="#DDE5EF" stroke-width="1.3" x1="601" x2="1000" y1="402" y2="402" /><text fill="#21A9B6" font-family="'DejaVu Sans',Arial,sans-serif" font-size="15" font-weight="700" x="601" y="431">OUTPUT  Clean local DuckDB tables</text><rect fill="#E3EAF3" height="247" rx="19" ry="19" stroke="none" stroke-width="1" width="458" x="1075" y="216" /><rect fill="#FFFFFF" height="247" rx="19" ry="19" stroke="#DDE5EF" stroke-width="1.2" width="458" x="1072" y="208" /><rect fill="#295DD5" height="247" rx="5" ry="5" stroke="none" stroke-width="1" width="9" x="1072" y="208" /><text fill="#295DD5" font-family="'DejaVu Sans',Arial,sans-serif" font-size="37" font-weight="700" x="1103" y="260">03</text><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="700" x="1180" y="259">BUILD RETRIEVAL</text><text fill="#60718A" font-family="'DejaVu Sans',Arial,sans-serif" font-size="17" font-weight="400" x="1103" y="296">Search text and exact identifiers</text><circle cx="1112" cy="327" fill="#295DD5" r="4" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="1126" y="334">BM25 + EmbeddingGemma 2</text><circle cx="1112" cy="356" fill="#295DD5" r="4" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="1126" y="363">Hybrid retrieval with vehicle filters</text><line stroke="#DDE5EF" stroke-width="1.3" x1="1103" x2="1502" y1="402" y2="402" /><text fill="#295DD5" font-family="'DejaVu Sans',Arial,sans-serif" font-size="15" font-weight="700" x="1103" y="431">OUTPUT  Evaluated retrieval baseline</text><rect fill="#E3EAF3" height="247" rx="19" ry="19" stroke="none" stroke-width="1" width="458" x="71" y="524" /><rect fill="#FFFFFF" height="247" rx="19" ry="19" stroke="#DDE5EF" stroke-width="1.2" width="458" x="68" y="516" /><rect fill="#21A9B6" height="247" rx="5" ry="5" stroke="none" stroke-width="1" width="9" x="68" y="516" /><text fill="#21A9B6" font-family="'DejaVu Sans',Arial,sans-serif" font-size="37" font-weight="700" x="99" y="568">04</text><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="700" x="176" y="567">ADD INVESTIGATION</text><text fill="#60718A" font-family="'DejaVu Sans',Arial,sans-serif" font-size="17" font-weight="400" x="99" y="604">Connect tools with LangGraph</text><circle cx="108" cy="635" fill="#21A9B6" r="4" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="122" y="642">Plan → retrieve → refine once</text><circle cx="108" cy="664" fill="#21A9B6" r="4" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="122" y="671">Build timeline and candidate links</text><line stroke="#DDE5EF" stroke-width="1.3" x1="99" x2="498" y1="710" y2="710" /><text fill="#21A9B6" font-family="'DejaVu Sans',Arial,sans-serif" font-size="15" font-weight="700" x="99" y="739">OUTPUT  Structured case report</text><rect fill="#E3EAF3" height="247" rx="19" ry="19" stroke="none" stroke-width="1" width="458" x="573" y="524" /><rect fill="#FFFFFF" height="247" rx="19" ry="19" stroke="#DDE5EF" stroke-width="1.2" width="458" x="570" y="516" /><rect fill="#D99230" height="247" rx="5" ry="5" stroke="none" stroke-width="1" width="9" x="570" y="516" /><text fill="#D99230" font-family="'DejaVu Sans',Arial,sans-serif" font-size="37" font-weight="700" x="601" y="568">05</text><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="700" x="678" y="567">VERIFY EVIDENCE</text><text fill="#60718A" font-family="'DejaVu Sans',Arial,sans-serif" font-size="17" font-weight="400" x="601" y="604">Do not overstate what is known</text><circle cx="610" cy="635" fill="#D99230" r="4" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="624" y="642">Check citations, dates, IDs</text><circle cx="610" cy="664" fill="#D99230" r="4" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="624" y="671">Separate allegations from actions</text><line stroke="#DDE5EF" stroke-width="1.3" x1="601" x2="1000" y1="710" y2="710" /><text fill="#D99230" font-family="'DejaVu Sans',Arial,sans-serif" font-size="15" font-weight="700" x="601" y="739">OUTPUT  Auditable, cautious findings</text><rect fill="#E3EAF3" height="247" rx="19" ry="19" stroke="none" stroke-width="1" width="458" x="1075" y="524" /><rect fill="#FFFFFF" height="247" rx="19" ry="19" stroke="#DDE5EF" stroke-width="1.2" width="458" x="1072" y="516" /><rect fill="#19816D" height="247" rx="5" ry="5" stroke="none" stroke-width="1" width="9" x="1072" y="516" /><text fill="#19816D" font-family="'DejaVu Sans',Arial,sans-serif" font-size="37" font-weight="700" x="1103" y="568">06</text><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="22" font-weight="700" x="1180" y="567">EVALUATE &amp; DEMO</text><text fill="#60718A" font-family="'DejaVu Sans',Arial,sans-serif" font-size="17" font-weight="400" x="1103" y="604">Measure quality; show the case</text><circle cx="1112" cy="635" fill="#19816D" r="4" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="1126" y="642">Ablate retrieval and agent steps</text><circle cx="1112" cy="664" fill="#19816D" r="4" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="1126" y="671">Streamlit timeline + source viewer</text><line stroke="#DDE5EF" stroke-width="1.3" x1="1103" x2="1502" y1="710" y2="710" /><text fill="#19816D" font-family="'DejaVu Sans',Arial,sans-serif" font-size="15" font-weight="700" x="1103" y="739">OUTPUT  Reproducible demo + metrics</text><line stroke="#A4B6CD" stroke-linecap="round" stroke-width="3" x1="529" x2="549.0" y1="331" y2="331.0" /><polygon fill="#A4B6CD" points="559,331 549.0,335.8 549.0,326.2" /><line stroke="#A4B6CD" stroke-linecap="round" stroke-width="3" x1="1031" x2="1051.0" y1="331" y2="331.0" /><polygon fill="#A4B6CD" points="1061,331 1051.0,335.8 1051.0,326.2" /><line stroke="#A4B6CD" stroke-linecap="round" stroke-width="3" x1="529" x2="549.0" y1="639" y2="639.0" /><polygon fill="#A4B6CD" points="559,639 549.0,643.8 549.0,634.2" /><line stroke="#A4B6CD" stroke-linecap="round" stroke-width="3" x1="1031" x2="1051.0" y1="639" y2="639.0" /><polygon fill="#A4B6CD" points="1061,639 1051.0,643.8 1051.0,634.2" /><text fill="#60718A" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="700" x="74" y="498">START WITH DATA + RETRIEVAL</text><text fill="#60718A" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="700" x="1073" y="498">THEN BUILD + TEST THE INVESTIGATOR</text><rect fill="#E7EEF8" height="60" rx="13" ry="13" stroke="none" stroke-width="1" width="1464" x="68" y="809" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="18" font-weight="600" x="95" y="846">MVP: 3 public-record case studies + 1 negative control     •     No VIN-specific diagnosis     •     ~35–60 focused hours</text></svg>