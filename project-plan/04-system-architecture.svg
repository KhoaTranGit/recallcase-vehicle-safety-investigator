ont-weight="400" x="334" y="336">Agency case history</text><rect fill="#FFFFFF" height="103" rx="13" ry="13" stroke="#DDE5EF" stroke-width="1" width="220" x="548" y="263" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="20" font-weight="700" x="565" y="305">Recalls</text><text fill="#60718A" font-family="'DejaVu Sans',Arial,sans-serif" font-size="14" font-weight="400" x="565" y="336">Campaign notices</text><line stroke="#A4B6CD" stroke-width="2.6" x1="196" x2="196" y1="367" y2="397" /><line stroke="#A4B6CD" stroke-width="2.6" x1="427" x2="427" y1="367" y2="397" /><line stroke="#A4B6CD" stroke-width="2.6" x1="658" x2="658" y1="367" y2="397" /><line stroke="#A4B6CD" stroke-width="2.6" x1="196" x2="658" y1="398" y2="398" /><line stroke="#A4B6CD" stroke-linecap="round" stroke-width="3" x1="427" x2="427.0" y1="399" y2="422.0" /><polygon fill="#A4B6CD" points="427,432 422.2,422.0 431.8,422.0" /><rect fill="#FFFFFF" height="122" rx="14" ry="14" stroke="#DDE5EF" stroke-width="1" width="631" x="119" y="436" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="24" font-weight="700" x="149" y="479">Normalize &amp; preserve provenance</text><text fill="#60718A" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="149" y="516">Polars  •  stable IDs  •  relevant dates  •  source URL  •  raw snapshot</text><line stroke="#A4B6CD" stroke-linecap="round" stroke-width="3" x1="427" x2="427.0" y1="558" y2="602.0" /><polygon fill="#A4B6CD" points="427,612 422.2,602.0 431.8,602.0" /><rect fill="#FFFFFF" height="125" rx="14" ry="14" stroke="#DDE5EF" stroke-width="1" width="305" x="117" y="616" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="23" font-weight="700" x="141" y="664">DuckDB</text><text fill="#60718A" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="141" y="702">Exact vehicle/date lookups</text><rect fill="#FFFFFF" height="125" rx="14" ry="14" stroke="#DDE5EF" stroke-width="1" width="305" x="447" y="616" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="23" font-weight="700" x="471" y="664">Hybrid index</text><text fill="#60718A" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="471" y="702">BM25 + dense vectors</text><text fill="#60718A" font-family="'DejaVu Sans',Arial,sans-serif" font-size="17" font-weight="400" x="123" y="790">Local, reproducible records; no nationwide crawler needed</text><rect fill="#E2EAF7" height="91" rx="13" ry="13" stroke="none" stroke-width="1" width="636" x="115" y="820" /><text fill="#295DD5" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="700" x="138" y="851">DATA GUARANTEE</text><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="138" y="880">Record IDs, date meanings, and raw-source links survive ingestion.</text><rect fill="#FFFFFF" height="94" rx="14" ry="14" stroke="#DDE5EF" stroke-width="1" width="668" x="925" y="268" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="23" font-weight="700" x="951" y="307">1  Question + vehicle filters</text><text fill="#60718A" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="951" y="338">Make / model / year • symptom • optional as-of date</text><line stroke="#A4B6CD" stroke-linecap="round" stroke-width="3" x1="1259" x2="1259.0" y1="362" y2="371.0" /><polygon fill="#A4B6CD" points="1259,381 1254.2,371.0 1263.8,371.0" /><rect fill="#FFFFFF" height="94" rx="14" ry="14" stroke="#DDE5EF" stroke-width="1" width="668" x="925" y="391" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="23" font-weight="700" x="951" y="430">2  Query planner</text><text fill="#60718A" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="951" y="461">Choose exact, semantic, or chronological tools</text><line stroke="#A4B6CD" stroke-linecap="round" stroke-width="3" x1="1259" x2="1259.0" y1="485" y2="494.0" /><polygon fill="#A4B6CD" points="1259,504 1254.2,494.0 1263.8,494.0" /><rect fill="#FFFFFF" height="121" rx="14" ry="14" stroke="#DDE5EF" stroke-width="1" width="668" x="925" y="514" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="23" font-weight="700" x="951" y="553">3  Retrieval tools</text><text fill="#60718A" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="951" y="584">Search complaints + lookup official actions + build timeline</text><line stroke="#A4B6CD" stroke-linecap="round" stroke-width="3" x1="1259" x2="1259.0" y1="635" y2="650.0" /><polygon fill="#A4B6CD" points="1259,660 1254.2,650.0 1263.8,650.0" /><rect fill="#FFFFFF" height="100" rx="14" ry="14" stroke="#DDE5EF" stroke-width="1" width="668" x="925" y="670" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="23" font-weight="700" x="951" y="709">4  Evidence verifier</text><text fill="#60718A" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="951" y="740">Validate source IDs, date cutoffs, and uncertain links</text><line stroke="#A4B6CD" stroke-linecap="round" stroke-width="3" x1="1259" x2="1259.0" y1="770" y2="786.0" /><polygon fill="#A4B6CD" points="1259,796 1254.2,786.0 1263.8,786.0" /><rect fill="#DDECE9" height="104" rx="14" ry="14" stroke="#DDE5EF" stroke-width="1" width="668" x="925" y="806" /><text fill="#192A43" font-family="'DejaVu Sans',Arial,sans-serif" font-size="23" font-weight="700" x="951" y="845">5  Cited case report</text><text fill="#60718A" font-family="'DejaVu Sans',Arial,sans-serif" font-size="16" font-weight="400" x="951" y="876">Answer • evidence timeline • direct links • open questions</text><line stroke="#295DD5" stroke-linecap="round" stroke-width="3" x1="752" x2="852.0" y1="667" y2="667.0" /><polygon fill="#295DD5" points="862,667 852.0,671.8 852.0,662.2" /><text fill="#295DD5" font-family="'DejaVu Sans',Arial,sans-serif" font-size="14" font-weight="700" x="759" y="643">candidates</text><line stroke="#295DD5" stroke-width="3" x1="862" x2="862" y1="667" y2="573" /><line stroke="#295DD5" stroke-linecap="round" stroke-width="3" x1="862" x2="915.0" y1="573" y2="573.0" /><polygon fill="#295DD5" points="925,573 915.0,577.8 915.0,568.2" /><rect fill="#D6E5F3" height="24" rx="10" ry="10" stroke="none" stroke-width="1" width="666" x="926" y="928" /><text fill="#295DD5" font-family="'DejaVu Sans',Arial,sans-serif" font-size="15" font-weight="700" x="934" y="945">Allegation ≠ investigation ≠ confirmed recall   •   Similarity ≠ causation</text></svg>
